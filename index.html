<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <!-- Viewport: எந்த சாதனத்திலும் Desktop View-ஐ கட்டாயப்படுத்த அகலம் 1280px என அமைக்கப்பட்டுள்ளது -->
    <meta name="viewport" content="width=1280">
    <title>அலுவலகக் கடிதம் (Office Letter)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Mukta Malar', 'Latha', 'Segoe UI', Tahoma, sans-serif;
            background-color: #f3f4f6;
        }

        /* Desktop Container: Top-Bottom layout */
        .desktop-wrapper {
            width: 1280px;
            margin: 0 auto;
            display: flex;
            flex-direction: column; /* Stack vertically */
            align-items: center; /* Center horizontally */
            gap: 3rem;
            padding: 20px 0;
        }

        /* Form Container Size */
        .form-container {
            width: 900px; /* Restricting width so it doesn't stretch too much */
        }

        /* Preview Container Layout */
        .preview-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 20px;
            width: 100%;
        }

        /* A4 Page Styling */
        .a4-page {
            width: 210mm;
            min-height: 297mm;
            padding: 20mm;
            background-color: white;
            /* Box-shadow மட்டும் இருக்கும், இது திரையில் (Screen) பார்க்கப் பக்கவாட்டில் நிழலைத் தரும். Print-ல் வராது */
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            box-sizing: border-box;
            color: #000;
            font-size: 15px;
            line-height: 1.6;
            display: block; 
            position: relative;
            
            /* Visual Page Break Guide: Draws a line every 297mm to simulate multiple A4 sheets on screen */
            background-image: repeating-linear-gradient(
                to bottom,
                transparent,
                transparent 296mm,
                #94a3b8 296mm,
                #94a3b8 296.5mm,
                transparent 296.5mm,
                transparent 297mm
            );
            background-size: 100% 297mm;
        }

        .indent-first-line {
            text-indent: 40px;
        }
        
        .reference-list {
            list-style-type: decimal;
            padding-left: 20px;
            margin: 0;
        }

        /* Seal / Footer styling */
        .print-footer-seal {
            margin-top: 60px;
            text-align: right;
            page-break-inside: avoid; 
        }

        /* Print Specific CSS */
        @media print {
            @page { 
                size: A4; 
                margin: 20mm; 
            }
            body { 
                background: white !important; 
                padding: 0 !important; 
            }
            .desktop-wrapper {
                width: 100% !important;
                display: block !important;
                padding: 0 !important;
            }
            .no-print, .preview-header { 
                display: none !important; 
            }
            .preview-wrapper {
                display: block;
                padding: 0;
                width: 100%;
            }
            .a4-page { 
                width: 100% !important; 
                min-height: auto !important;
                margin: 0 !important; 
                padding: 0 !important; 
                box-shadow: none !important; 
                background-image: none !important; 
                border: none !important; /* அச்சிடும் போது எந்த கட்டமும் வரக்கூடாது என்பதை உறுதி செய்கிறது */
            }
        }
    </style>
</head>
<body class="overflow-x-auto">

    <div class="desktop-wrapper">
        
        <!-- INPUT FORM (TOP) -->
        <div class="form-container no-print bg-white p-8 rounded-lg shadow-md border border-gray-200">
            <h2 class="text-2xl font-bold mb-6 text-blue-800 text-center border-b pb-2">கடித விவரங்கள்</h2>
            
            <form id="letterForm" class="space-y-5">
                <!-- Sender Details -->
                <div>
                    <div class="flex justify-between mb-1">
                        <label class="font-semibold text-gray-700">அனுப்புநர் (From):</label>
                        <div class="space-x-2">
                            <button type="button" onclick="saveSender()" class="text-xs bg-green-600 text-white px-3 py-1 rounded">SAVE</button>
                            <button type="button" onclick="clearSender()" class="text-xs bg-red-600 text-white px-3 py-1 rounded">CLEAR</button>
                        </div>
                    </div>
                    <textarea id="senderInput" rows="3" class="w-full p-3 border-2 border-blue-400 rounded outline-none focus:border-blue-600" oninput="updatePreview()"></textarea>
                </div>

                <!-- Recipient Details -->
                <div>
                    <label class="font-semibold text-gray-700">பெறுநர் (To):</label>
                    <textarea id="recipientInput" rows="3" class="w-full p-3 border-2 border-blue-400 rounded outline-none focus:border-blue-600" oninput="updatePreview()"></textarea>
                </div>

                <!-- Ref & Date -->
                <div class="grid grid-cols-2 gap-6">
                    <div>
                        <label class="font-semibold text-gray-700">ந.க.எண்:</label>
                        <input type="text" id="refNoInput" class="w-full p-3 border-2 border-blue-400 rounded outline-none focus:border-blue-600" oninput="updatePreview()">
                    </div>
                    <div>
                        <label class="font-semibold text-gray-700">நாள்:</label>
                        <input type="text" id="dateInput" class="w-full p-3 border-2 border-blue-400 rounded outline-none focus:border-blue-600" oninput="updatePreview()">
                    </div>
                </div>

                <!-- Subject -->
                <div>
                    <label class="font-semibold text-gray-700">பொருள்:</label>
                    <input type="text" id="subjectInput" class="w-full p-3 border-2 border-blue-400 rounded outline-none focus:border-blue-600" oninput="updatePreview()" placeholder="பொருள்...">
                </div>

                <!-- References -->
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="font-semibold text-gray-700">பார்வை:</label>
                        <button type="button" onclick="addReferenceInput()" class="text-sm bg-blue-600 text-white px-3 py-1 rounded">+ புதிய பார்வை</button>
                    </div>
                    <div id="referenceContainer" class="space-y-3">
                        <input type="text" class="reference-input w-full p-3 border-2 border-blue-400 rounded outline-none focus:border-blue-600" oninput="updatePreview()" placeholder="பார்வை 1...">
                    </div>
                </div>

                <!-- Content -->
                <div>
                    <label class="font-semibold text-gray-700">செய்தி:</label>
                    <textarea id="bodyInput" rows="6" class="w-full p-3 border-2 border-blue-400 rounded outline-none focus:border-blue-600" oninput="updatePreview()"></textarea>
                </div>

                <!-- Seal / Stamp Details (Bottom Right) -->
                <div>
                    <div class="flex justify-between mb-1">
                        <label class="font-semibold text-gray-700">அலுவலக முத்திரை / Seal:</label>
                        <div class="space-x-2">
                            <button type="button" onclick="saveSeal()" class="text-xs bg-green-600 text-white px-3 py-1 rounded">SAVE</button>
                            <button type="button" onclick="clearSeal()" class="text-xs bg-red-600 text-white px-3 py-1 rounded">CLEAR</button>
                        </div>
                    </div>
                    <textarea id="sealInput" rows="3" class="w-full p-3 border-2 border-blue-400 rounded outline-none focus:border-blue-600" placeholder="பள்ளி முத்திரை / அலுவலக முகவரி விவரங்கள்..." oninput="updatePreview()"></textarea>
                </div>

                <div class="pt-4">
                    <button type="button" onclick="window.print()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded transition-colors duration-200 text-lg shadow-lg">அச்சிடுக / PDF ஆக சேமிக்க</button>
                </div>
            </form>
        </div>

        <!-- PREVIEW SECTION (BOTTOM) -->
        <div class="preview-wrapper">
            <!-- Preview Heading -->
            <h2 class="text-2xl font-bold mb-6 text-emerald-700 text-center preview-header tracking-wide border-b-2 border-emerald-200 pb-2 w-full max-w-4xl">முன்னோட்டம் (Preview)<br>
            <span class="text-sm text-gray-600 font-normal">Printout இல் alignment சரியாக வந்துவிடும்</span></h2>
            
            <div id="pdfContent" class="a4-page">
                <!-- Header -->
                <div class="grid grid-cols-2 gap-4 mb-6">
                    <div>
                        <p class="font-bold">அனுப்புநர்</p>
                        <div id="prevSender" class="whitespace-pre-line pl-2"></div>
                    </div>
                    <div>
                        <p class="font-bold">பெறுநர்</p>
                        <div id="prevRecipient" class="whitespace-pre-line pl-2"></div>
                    </div>
                </div>

                <!-- Divider -->
                <div class="my-4">
                    <hr class="border-black border-t-2">
                    <div class="flex justify-between items-center py-2 px-1 font-semibold">
                        <div>ந.க.எண் : <span id="prevRefNo"></span></div>
                        <div>நாள் : <span id="prevDate"></span></div>
                    </div>
                    <hr class="border-black border-t-2">
                </div>

                <p class="my-4 font-semibold">ஐயா / அம்மையீர்,</p>

                <!-- Subject & Reference -->
                <div class="pl-6 mb-6 space-y-2">
                    <div class="flex">
                        <span class="font-bold min-w-[80px]">பொருள் :</span>
                        <span id="prevSubject" class="text-justify"></span>
                    </div>
                    <div class="flex">
                        <span class="font-bold min-w-[80px]">பார்வை :</span>
                        <div id="prevReferenceContainer"></div>
                    </div>
                </div>

                <!-- Main Body Content -->
                <div id="prevBody" class="whitespace-pre-line text-justify indent-first-line"></div>
                
                <!-- Bottom Footer (Seal Section aligned Right) -->
                <div class="print-footer-seal">
                    <div id="prevSeal" class="whitespace-pre-line text-center font-semibold text-gray-800 inline-block min-w-[200px]"></div>
                </div>
            </div>

            <!-- Contact Details -->
            <div class="no-print mt-10 p-4 bg-white border border-gray-200 shadow-sm rounded-lg w-full max-w-4xl text-center">
                <p class="text-lg font-semibold text-gray-700">சந்தேகங்கள் மற்றும் கருத்துக்கள் வரவேற்கப்படுகின்றன <span class="text-blue-700">9944204981</span>.</p>
            </div>

        </div>
    </div>

    <script>
        window.onload = function() {
            const today = new Date();
            document.getElementById('dateInput').value = String(today.getDate()).padStart(2, '0') + '.' + String(today.getMonth() + 1).padStart(2, '0') + '.' + today.getFullYear();
            
            // Load saved sender
            const savedSender = localStorage.getItem('officeLetterSender');
            if (savedSender) document.getElementById('senderInput').value = savedSender;

            // Load saved seal
            const savedSeal = localStorage.getItem('officeLetterSeal');
            if (savedSeal) document.getElementById('sealInput').value = savedSeal;

            updatePreview();
        };

        function addReferenceInput() {
            const container = document.getElementById('referenceContainer');
            const inputs = container.getElementsByClassName('reference-input');
            const newIndex = inputs.length + 1;
            
            const newInput = document.createElement('input');
            newInput.type = 'text';
            newInput.className = 'reference-input w-full p-3 border-2 border-blue-400 rounded outline-none focus:border-blue-600 mt-3';
            newInput.placeholder = 'பார்வை ' + newIndex + '...';
            newInput.oninput = updatePreview;
            
            container.appendChild(newInput);
            updatePreview();
        }

        function updatePreview() {
            document.getElementById('prevSender').innerText = document.getElementById('senderInput').value;
            document.getElementById('prevRecipient').innerText = document.getElementById('recipientInput').value;
            document.getElementById('prevRefNo').innerText = document.getElementById('refNoInput').value;
            document.getElementById('prevDate').innerText = document.getElementById('dateInput').value;
            
            // Subject Formatting
            let subjectText = document.getElementById('subjectInput').value.trim();
            if (subjectText) {
                 if (!subjectText.endsWith('- சார்பு') && !subjectText.endsWith('சார்பு')) {
                     subjectText += ' - சார்பு.';
                 }
            }
            document.getElementById('prevSubject').innerText = subjectText;

            // Reference List Formatting
            const refInputs = document.getElementsByClassName('reference-input');
            const prevRefContainer = document.getElementById('prevReferenceContainer');
            prevRefContainer.innerHTML = '';
            
            let activeRefs = [];
            for (let i = 0; i < refInputs.length; i++) {
                if (refInputs[i].value.trim() !== '') {
                    activeRefs.push(refInputs[i].value.trim());
                }
            }

            if (activeRefs.length === 1) {
                prevRefContainer.innerText = activeRefs[0];
            } else if (activeRefs.length > 1) {
                const ol = document.createElement('ol');
                ol.className = 'reference-list';
                activeRefs.forEach(refText => {
                    const li = document.createElement('li');
                    li.innerText = refText;
                    ol.appendChild(li);
                });
                prevRefContainer.appendChild(ol);
            }

            // Body Formatting
            document.getElementById('prevBody').innerText = document.getElementById('bodyInput').value;

            // Seal Formatting
            document.getElementById('prevSeal').innerText = document.getElementById('sealInput').value;
        }

        // Sender Storage Functions
        function saveSender() {
            const val = document.getElementById('senderInput').value;
            if (val.trim()) {
                localStorage.setItem('officeLetterSender', val);
                alert('அனுப்புநர் விவரங்கள் சேமிக்கப்பட்டது!');
            }
        }

        function clearSender() {
            localStorage.removeItem('officeLetterSender');
            document.getElementById('senderInput').value = '';
            updatePreview();
        }

        // Seal Storage Functions
        function saveSeal() {
            const val = document.getElementById('sealInput').value;
            if (val.trim()) {
                localStorage.setItem('officeLetterSeal', val);
                alert('முத்திரை விவரங்கள் சேமிக்கப்பட்டது!');
            }
        }

        function clearSeal() {
            localStorage.removeItem('officeLetterSeal');
            document.getElementById('sealInput').value = '';
            updatePreview();
        }
    </script>
</body>
</html>
