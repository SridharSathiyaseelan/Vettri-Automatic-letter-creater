<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>அலுவலகக் கடிதம் (Office Letter)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Mukta Malar', 'Latha', 'Segoe UI', Tahoma, sans-serif;
            background-color: #f3f4f6;
        }

        .a4-page {
            width: 210mm;
            min-height: 297mm;
            padding: 20mm;
            margin: 0 auto;
            background: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            box-sizing: border-box;
            color: #000;
            font-size: 15px;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .indent-first-line {
            text-indent: 40px;
        }
        
        .reference-list {
            list-style-type: decimal;
            padding-left: 20px;
            margin: 0;
        }

        @media print {
            body { background: white !important; padding: 0 !important; }
            .no-print { display: none !important; }
            .a4-page { box-shadow: none !important; width: 100% !important; margin: 0 !important; padding: 15mm !important; min-height: 100vh !important; }
        }
    </style>
</head>
<body class="p-4">

    <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-8">
        
        <!-- INPUT FORM -->
        <div class="no-print bg-white p-6 rounded-lg shadow-md border border-gray-200">
            <h2 class="text-xl font-bold mb-4 text-blue-800">கடித விவரங்கள்</h2>
            
            <form id="letterForm" class="space-y-4">
                <!-- Sender Details -->
                <div>
                    <div class="flex justify-between mb-1">
                        <label class="font-semibold text-gray-700">அனுப்புநர் (From):</label>
                        <div class="space-x-2">
                            <button type="button" onclick="saveSender()" class="text-xs bg-green-600 text-white px-2 py-1 rounded">சேமி</button>
                            <button type="button" onclick="clearSender()" class="text-xs bg-red-600 text-white px-2 py-1 rounded">அழி</button>
                        </div>
                    </div>
                    <textarea id="senderInput" rows="3" class="w-full p-2 border rounded" oninput="updatePreview()"></textarea>
                </div>

                <!-- Recipient Details -->
                <div>
                    <label class="font-semibold text-gray-700">பெறுநர் (To):</label>
                    <textarea id="recipientInput" rows="3" class="w-full p-2 border rounded" oninput="updatePreview()"></textarea>
                </div>

                <!-- Ref & Date -->
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="font-semibold text-gray-700">ந.க.எண்:</label>
                        <input type="text" id="refNoInput" class="w-full p-2 border rounded" oninput="updatePreview()">
                    </div>
                    <div>
                        <label class="font-semibold text-gray-700">நாள்:</label>
                        <input type="text" id="dateInput" class="w-full p-2 border rounded" oninput="updatePreview()">
                    </div>
                </div>

                <!-- Subject -->
                <div>
                    <label class="font-semibold text-gray-700">பொருள்:</label>
                    <input type="text" id="subjectInput" class="w-full p-2 border rounded" oninput="updatePreview()" placeholder="பொருள்...">
                </div>

                <!-- References -->
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="font-semibold text-gray-700">பார்வை:</label>
                        <button type="button" onclick="addReferenceInput()" class="text-xs bg-blue-600 text-white px-2 py-1 rounded">+ புதிய பார்வை</button>
                    </div>
                    <div id="referenceContainer" class="space-y-2">
                        <input type="text" class="reference-input w-full p-2 border rounded" oninput="updatePreview()" placeholder="பார்வை 1...">
                    </div>
                </div>

                <!-- Content -->
                <div>
                    <label class="font-semibold text-gray-700">செய்தி:</label>
                    <textarea id="bodyInput" rows="5" class="w-full p-2 border rounded" oninput="updatePreview()"></textarea>
                </div>

                <!-- Seal / Stamp Details (Bottom Right) -->
                <div>
                    <div class="flex justify-between mb-1">
                        <label class="font-semibold text-gray-700">அலுவலக முத்திரை / Seal (Bottom Right):</label>
                        <div class="space-x-2">
                            <button type="button" onclick="saveSeal()" class="text-xs bg-green-600 text-white px-2 py-1 rounded">சேமி</button>
                            <button type="button" onclick="clearSeal()" class="text-xs bg-red-600 text-white px-2 py-1 rounded">அழி</button>
                        </div>
                    </div>
                    <textarea id="sealInput" rows="3" class="w-full p-2 border rounded" placeholder="பள்ளி முத்திரை / அலுவலக முகவரி விவரங்கள்..." oninput="updatePreview()"></textarea>
                </div>

                <button type="button" onclick="window.print()" class="w-full bg-emerald-600 text-white font-bold py-3 rounded">அச்சிடுக / PDF ஆக சேமிக்க</button>
            </form>
        </div>

        <!-- PREVIEW -->
        <div>
            <div id="pdfContent" class="a4-page border">
                <div>
                    <!-- Header -->
                    <div class="grid grid-cols-2 gap-4 mb-6">
                        <div>
                            <p class="font-bold">அனுப்புநர்</p>
                            <div id="prevSender" class="whitespace-pre-line pl-2"></div>
                        </div>
                        <div>
                            <p class="font-bold">பெறுநர்</p>
                            <div id="prevRecipient" class="whitespace-pre-line pl-2"></div>
                        </div>
                    </div>

                    <!-- Divider -->
                    <div class="my-4">
                        <hr class="border-black border-t-2">
                        <div class="flex justify-between items-center py-2 px-1 font-semibold">
                            <div>ந.க.எண் : <span id="prevRefNo"></span></div>
                            <div>நாள் : <span id="prevDate"></span></div>
                        </div>
                        <hr class="border-black border-t-2">
                    </div>

                    <p class="my-4">ஐயா / அம்மையீர்,</p>

                    <!-- Subject & Reference -->
                    <div class="pl-6 mb-6 space-y-2">
                        <div class="flex">
                            <span class="font-bold min-w-[80px]">பொருள் :</span>
                            <span id="prevSubject"></span>
                        </div>
                        <div class="flex">
                            <span class="font-bold min-w-[80px]">பார்வை :</span>
                            <div id="prevReferenceContainer"></div>
                        </div>
                    </div>

                    <!-- Main Body Content -->
                    <div id="prevBody" class="whitespace-pre-line text-justify indent-first-line mb-8"></div>
                </div>

                <!-- Bottom Footer (Seal Section aligned Right) -->
                <div class="pt-6 flex justify-end">
                    <div id="prevSeal" class="whitespace-pre-line text-center font-semibold text-gray-800 min-w-[200px]"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        window.onload = function() {
            const today = new Date();
            document.getElementById('dateInput').value = String(today.getDate()).padStart(2, '0') + '.' + String(today.getMonth() + 1).padStart(2, '0') + '.' + today.getFullYear();
            
            // Load saved sender
            const savedSender = localStorage.getItem('officeLetterSender');
            if (savedSender) document.getElementById('senderInput').value = savedSender;

            // Load saved seal
            const savedSeal = localStorage.getItem('officeLetterSeal');
            if (savedSeal) document.getElementById('sealInput').value = savedSeal;

            updatePreview();
        };

        function addReferenceInput() {
            const container = document.getElementById('referenceContainer');
            const inputs = container.getElementsByClassName('reference-input');
            const newIndex = inputs.length + 1;
            
            const newInput = document.createElement('input');
            newInput.type = 'text';
            newInput.className = 'reference-input w-full p-2 border rounded mt-2';
            newInput.placeholder = 'பார்வை ' + newIndex + '...';
            newInput.oninput = updatePreview;
            
            container.appendChild(newInput);
            updatePreview();
        }

        function updatePreview() {
            document.getElementById('prevSender').innerText = document.getElementById('senderInput').value;
            document.getElementById('prevRecipient').innerText = document.getElementById('recipientInput').value;
            document.getElementById('prevRefNo').innerText = document.getElementById('refNoInput').value;
            document.getElementById('prevDate').innerText = document.getElementById('dateInput').value;
            
            // Subject Formatting
            let subjectText = document.getElementById('subjectInput').value.trim();
            if (subjectText) {
                 if (!subjectText.endsWith('- சார்பு') && !subjectText.endsWith('சார்பு')) {
                     subjectText += ' - சார்பு.';
                 }
            }
            document.getElementById('prevSubject').innerText = subjectText;

            // Reference List Formatting
            const refInputs = document.getElementsByClassName('reference-input');
            const prevRefContainer = document.getElementById('prevReferenceContainer');
            prevRefContainer.innerHTML = '';
            
            let activeRefs = [];
            for (let i = 0; i < refInputs.length; i++) {
                if (refInputs[i].value.trim() !== '') {
                    activeRefs.push(refInputs[i].value.trim());
                }
            }

            if (activeRefs.length === 1) {
                prevRefContainer.innerText = activeRefs[0];
            } else if (activeRefs.length > 1) {
                const ol = document.createElement('ol');
                ol.className = 'reference-list';
                activeRefs.forEach(refText => {
                    const li = document.createElement('li');
                    li.innerText = refText;
                    ol.appendChild(li);
                });
                prevRefContainer.appendChild(ol);
            }

            // Body Formatting
            document.getElementById('prevBody').innerText = document.getElementById('bodyInput').value;

            // Seal Formatting
            document.getElementById('prevSeal').innerText = document.getElementById('sealInput').value;
        }

        // Sender Storage Functions
        function saveSender() {
            const val = document.getElementById('senderInput').value;
            if (val.trim()) {
                localStorage.setItem('officeLetterSender', val);
                alert('அனுப்புநர் விவரங்கள் சேமிக்கப்பட்டது!');
            }
        }

        function clearSender() {
            localStorage.removeItem('officeLetterSender');
            document.getElementById('senderInput').value = '';
            updatePreview();
        }

        // Seal Storage Functions
        function saveSeal() {
            const val = document.getElementById('sealInput').value;
            if (val.trim()) {
                localStorage.setItem('officeLetterSeal', val);
                alert('முத்திரை விவரங்கள் சேமிக்கப்பட்டது!');
            }
        }

        function clearSeal() {
            localStorage.removeItem('officeLetterSeal');
            document.getElementById('sealInput').value = '';
            updatePreview();
        }
    </script>
</body>
</html>
